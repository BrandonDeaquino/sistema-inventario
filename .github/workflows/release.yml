
name: Liberacion del Sistema de Inventario

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  liberar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar entorno .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore

      - name: Compilar proyecto
        run: dotnet build --configuration Release --no-restore

      - name: Ejecutar pruebas automatizadas
        run: dotnet run --project tests/SistemaInventario.Tests/SistemaInventario.Tests.csproj --configuration Release

      - name: Publicar aplicacion
        run: |
          dotnet publish src/InventarioProductos/InventarioProductos.csproj \
            --configuration Release \
            --no-self-contained \
            -p:UseAppHost=false \
            --output publish

      - name: Crear paquete de distribucion
        run: |
          zip -r sistema-inventario-${GITHUB_REF_NAME}.zip publish/

      - name: Publicar version en GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: Sistema de Inventario ${{ github.ref_name }}
          files: sistema-inventario-${{ github.ref_name }}.zip
          generate_release_notes: true
